chroma:
  host: null
  persist_dir: ./data/chroma
  port: null
cors:
  allow_credentials: true
  allow_headers:
  - Content-Type
  - Authorization
  - X-Requested-With
  allow_methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  origins:
  - http://localhost:3315
  - http://127.0.0.1:3315
hybrid:
  alpha: 0.5
  beta: 0.5
  bm25_persist_dir: ./data/bm25
  rrf_k: 60
indexer:
  allowed_roots: []
  chunk_overlap: 50
  chunk_size: 500
  exclude_dirs:
  - node_modules
  - .git
  - __pycache__
  - venv
  - .venv
  - dist
  - build
  file_types:
  - .py
  - .ts
  - .js
  - .md
  - .vue
  max_file_size: 1048576
logging:
  file: ./logs/app.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
providers:
  embedding:
    default: ''
    instances: []
  llm:
    default: ''
    instances: []
  rerank:
    default: flashrank
    instances:
    - model: ms-marco-TinyBERT-L-2-v2
      name: flashrank
      type: flashrank
    - name: rerank-engine
      post_processors:
      - config:
          min_score: 0.3
        type: threshold
      rank_strategy: standard
      scorer_config:
        batch_size: 32
        max_length: 512
        model_path: ./data/models/flashrank-TinyBERT-L-2-v2.onnx
        tokenizer_path: ./data/models/tokenizer.json
      scorer_type: onnx
      type: rerank-engine
  vectorstore:
    default: ''
    instances: []
server:
  debug: true
  host: 0.0.0.0
  port: 8818
watcher:
  debounce_seconds: 1.0
  enabled: true
