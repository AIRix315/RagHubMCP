# RagHubMCP 配置文件
# 
# 这是一个空白配置模板，用于生产环境部署。
# 开发/测试配置参考请查看 config.yaml.example
#
# Provider 配置说明：
# - 请通过 Web 控制台 (http://localhost:3315) 添加 Provider
# - 或参考 config.yaml.example 手动配置后重启服务

server:
  host: 0.0.0.0
  port: 8818
  debug: true

# Chroma 向量数据库配置
chroma:
  host: null
  persist_dir: ./data/chroma
  port: null

# CORS 跨域配置
cors:
  allow_credentials: true
  allow_headers:
    - Content-Type
    - Authorization
    - X-Requested-With
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  origins:
    - http://localhost:3315
    - http://127.0.0.1:3315

# 混合搜索配置
hybrid:
  alpha: 0.5
  beta: 0.5
  bm25_persist_dir: ./data/bm25
  rrf_k: 60

# 文件索引器配置
indexer:
  allowed_roots: []
  chunk_overlap: 50
  chunk_size: 500
  exclude_dirs:
    - node_modules
    - .git
    - __pycache__
    - venv
    - .venv
    - dist
    - build
  file_types:
    - .py
    - .ts
    - .js
    - .md
    - .vue
  max_file_size: 1048576

# 日志配置
logging:
  file: ./logs/app.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO

# Provider 配置 - 空白初始状态
# 请通过 Web 控制台添加 Provider
providers:
  embedding:
    default: ""
    instances: []
  llm:
    default: ""
    instances: []
  rerank:
    default: ""
    instances: []
  vectorstore:
    default: ""
    instances: []

# 文件监视器配置
watcher:
  debounce_seconds: 1.0
  enabled: true