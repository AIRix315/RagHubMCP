# RAG Pipeline Evaluation Workflow
# Manual trigger for running evaluation tests
# Reference: TODO-V2.md Phase 5.8

name: RAG Evaluation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to evaluate (fast, balanced, accurate, or comma-separated for comparison)'
        required: false
        default: 'balanced'
        type: string
      top_k:
        description: 'Number of results to retrieve'
        required: false
        default: '10'
        type: string
      compare_all:
        description: 'Compare all profiles (fast, balanced, accurate)'
        required: false
        default: false
        type: boolean
      output_format:
        description: 'Output format'
        required: false
        default: 'json'
        type: choice
        options:
          - json
          - markdown

permissions:
  contents: read

jobs:
  # ============================================
  # Evaluation Job - Run pipeline evaluation
  # ============================================
  evaluate:
    name: Evaluate RAG Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            backend/pyproject.toml
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run evaluation
        id: evaluate
        run: |
          # Prepare output directory
          mkdir -p evaluation_results
          
          # Determine evaluation mode
          if [ "${{ inputs.compare_all }}" == "true" ]; then
            echo "Running comparison across all profiles..."
            python -m scripts.evaluate \
              --compare fast,balanced,accurate \
              --top-k ${{ inputs.top_k }} \
              --format ${{ inputs.output_format }} \
              --output evaluation_results/comparison.${{ inputs.output_format }}
          else
            echo "Running evaluation with profile: ${{ inputs.profile }}"
            python -m scripts.evaluate \
              --profile ${{ inputs.profile }} \
              --top-k ${{ inputs.top_k }} \
              --format ${{ inputs.output_format }} \
              --output evaluation_results/results.${{ inputs.output_format }}
          fi
        continue-on-error: true
      
      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: backend/evaluation_results/
          retention-days: 30
      
      - name: Display results
        if: always()
        run: |
          if [ -f "evaluation_results/results.${{ inputs.output_format }}" ]; then
            cat "evaluation_results/results.${{ inputs.output_format }}"
          elif [ -f "evaluation_results/comparison.${{ inputs.output_format }}" ]; then
            cat "evaluation_results/comparison.${{ inputs.output_format }}"
          fi

  # ============================================
  # Summary Job - Create summary report
  # ============================================
  summary:
    name: Evaluation Summary
    runs-on: ubuntu-latest
    needs: evaluate
    if: always()
    
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: evaluation-results
          path: results/
      
      - name: Create summary
        run: |
          echo "## RAG Pipeline Evaluation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile**: ${{ inputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Top K**: ${{ inputs.top_k }}" >> $GITHUB_STEP_SUMMARY
          echo "**Compare All**: ${{ inputs.compare_all }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          if [ -f "results/results.json" ]; then
            cat results/results.json >> $GITHUB_STEP_SUMMARY
          elif [ -f "results/comparison.json" ]; then
            cat results/comparison.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file found" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY